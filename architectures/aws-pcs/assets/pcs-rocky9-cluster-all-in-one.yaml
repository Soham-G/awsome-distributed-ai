  # --- SMALL TEST QUEUES (single-GPU, single-NIC, NO EFA), primary AZ ---
  # Cheap way to boot ONE real g7e (Blackwell) / g6e (Ada) GPU node and run
  # nvidia-smi to verify the open-kernel-module fix. Both OFF by default (PCS caps
  # a cluster at 10 node groups; the default 9 GPU queues + login already hit it, so
  # enable a test queue only after disabling a 48xl queue). Forwarded to deploy-all.
  DeployG7eSmallTest:
    Type: String
    Description: Deploy a small g7e.2xlarge (1x RTX PRO 6000 Blackwell, no EFA) test queue in the primary AZ for nvidia-smi verification
    Default: 'false'
    AllowedValues: ['true', 'false']
  G7eSmallTestName:
    Type: String
    Description: Node group + queue name for the g7e small test queue
    Default: "gpu-g7e-test"
  G7eSmallTestInstanceType:
    Type: String
    Description: Small g7e test instance type (1 GPU, no EFA)
    Default: "g7e.2xlarge"
    AllowedValues: ["g7e.2xlarge", "g7e.4xlarge", "g7e.8xlarge", "g7e.16xlarge"]
  G7eSmallTestMaxCount:
    Type: Number
    Description: Maximum number of instances for the g7e small test queue
    Default: 1
    MinValue: 0
  G7eSmallTestMinCount:
    Type: Number
    Description: Minimum number of instances for the g7e small test queue (0 for dynamic scaling)
    Default: 0
    MinValue: 0

  DeployG6eSmallTest:
    Type: String
    Description: Deploy a small g6e.2xlarge (1x L40S, no EFA) test queue in the primary AZ for nvidia-smi verification
    Default: 'false'
    AllowedValues: ['true', 'false']
  G6eSmallTestName:
    Type: String
    Description: Node group + queue name for the g6e small test queue
    Default: "gpu-g6e-test"
  G6eSmallTestInstanceType:
    Type: String
    Description: Small g6e test instance type (1 GPU, no EFA)
    Default: "g6e.2xlarge"
    AllowedValues: ["g6e.2xlarge", "g6e.4xlarge", "g6e.8xlarge", "g6e.16xlarge"]
  G6eSmallTestMaxCount:
    Type: Number
    Description: Maximum number of instances for the g6e small test queue
    Default: 1
    MinValue: 0
  G6eSmallTestMinCount:
    Type: Number
    Description: Minimum number of instances for the g6e small test queue (0 for dynamic scaling)
    Default: 0
    MinValue: 0

  # --- shared GPU knob (applies to every On-Demand GPU queue above) ---
  RootVolumeSize:
    Type: Number
    Description: >-
      Root EBS volume size (GiB) for all node groups. The PCS-Ready DLAMI default
      (~75 GiB) is too small for pulling/importing large container images; 300
      GiB gives ample headroom. Passed down to every compute node group stack.
    Default: 300
    MinValue: 75

# FSx throughput is a discrete grid that depends on the chosen deployment type.
# These Rules reject an invalid (DeploymentType, throughput) pair at stack-create
# time with a clear message, instead of letting it fail deep inside the nested
# prerequisites stack as an opaque CreateFileSystem error.

Conditions:
  # Build the AMI only when the user did not supply one.
  BuildAmi: !Equals [!Ref AmiId, '']

Resources:
  #############################################################################
  # Build VPC (build path only). The cluster's own VPC is created LATER inside
  # ClusterStack (it depends on the AMI id), so at build time there is no cluster
  # subnet to use -- and most accounts here have no default VPC. This minimal,
  # self-contained VPC (one public subnet + IGW) gives the Image Builder instance
  # the internet egress it needs. It exists ONLY on the build path and is torn
  # down with the stack; the cluster does NOT use it.
  #############################################################################
  BuildVPC:
    Type: AWS::EC2::VPC
    Condition: BuildAmi
    Properties:
      CidrBlock: 10.222.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ami-build-vpc'

  BuildIGW:
    Type: AWS::EC2::InternetGateway
    Condition: BuildAmi
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ami-build-igw'

  BuildIGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: BuildAmi
    Properties:
      VpcId: !Ref BuildVPC
      InternetGatewayId: !Ref BuildIGW

  BuildSubnet:
    Type: AWS::EC2::Subnet
    Condition: BuildAmi
    Properties:
      VpcId: !Ref BuildVPC
      CidrBlock: 10.222.0.0/24
      AvailabilityZone: !Ref PrimarySubnetAZ
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ami-build-subnet'

  BuildRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: BuildAmi
    Properties:
      VpcId: !Ref BuildVPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ami-build-rt'

  BuildDefaultRoute:
    Type: AWS::EC2::Route
    Condition: BuildAmi
    DependsOn: BuildIGWAttach
    Properties:
      RouteTableId: !Ref BuildRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref BuildIGW

  BuildSubnetRTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: BuildAmi
    Properties:
      SubnetId: !Ref BuildSubnet
      RouteTableId: !Ref BuildRouteTable

  BuildSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: BuildAmi
    Properties:
      GroupDescription: !Sub 'Egress for the ${AWS::StackName} Rocky 9 AMI build instance'
      VpcId: !Ref BuildVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound (443 to aws-pcs-repo/EFA/NVIDIA/Rocky/GitHub + SSM)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ami-build-sg'

  #############################################################################
  # Stage 1 (build path only): build the PCS-Ready Rocky 9 GPU AMI. CloudFormation
  # blocks on this ~45-60 min Image Builder run before creating the cluster, then
  # feeds its output AMI id into ClusterStack below.
  #############################################################################
  Rocky9AmiStack:
    Type: AWS::CloudFormation::Stack
    Condition: BuildAmi
    Properties:
      TemplateURL: !Sub 'https://${S3BucketName}.s3.amazonaws.com/${S3KeyPrefix}pcs-ready-rocky9-gpu.yaml'
      Parameters:
        BaseAmiId: !Ref BaseAmiId
        SlurmVersion: !Ref SlurmVersion
        SemanticVersion: !Ref SemanticVersion
        SELinuxMode: !Ref SELinuxMode
        NvidiaKernelModuleFlavor: !Ref NvidiaKernelModuleFlavor
        SubnetId: !Ref BuildSubnet
        SecurityGroupIds: !Ref BuildSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Rocky9Ami'

  #############################################################################
  # Stage 2: the full PCS cluster, on the built (or supplied) AMI. This is the
  # SAME pcs-ml-cluster-deploy-all.yaml the standard guides use -- every parameter
  # here is a straight passthrough, so anything those guides document applies.
  #############################################################################
  ClusterStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3BucketName}.s3.amazonaws.com/${S3KeyPrefix}pcs-ml-cluster-deploy-all.yaml'
      Parameters:
        S3BucketName: !Ref S3BucketName
        S3KeyPrefix: !Ref S3KeyPrefix
        # AmiId = the one you supplied, or the one we just built.
        AmiId: !If
          - BuildAmi
          - !GetAtt Rocky9AmiStack.Outputs.Rocky9PCSAmiId
          - !Ref AmiId
        SlurmVersion: !Ref SlurmVersion
        PrimarySubnetAZ: !Ref PrimarySubnetAZ
        AdditionalSubnetAZ2: !Ref AdditionalSubnetAZ2
        AdditionalSubnetAZ3: !Ref AdditionalSubnetAZ3
        GpuUsePlacementGroup: !Ref GpuUsePlacementGroup
        SSHAccessCidr: !Ref SSHAccessCidr
        MonitoringStack: !Ref MonitoringStack
        DirectoryService: !Ref DirectoryService
        ManagedAccounting: !Ref ManagedAccounting
        DataRepositoryS3Bucket: !Ref DataRepositoryS3Bucket
        LoginNodeInstanceType: !Ref LoginNodeInstanceType
        ComputeInitScriptsDir: !Ref ComputeInitScriptsDir
        PostInstallScriptUrl: !Ref PostInstallScriptUrl
        CreateS3Endpoint: !Ref CreateS3Endpoint
        Capacity: !Ref Capacity
        LustreDeploymentType: !Ref LustreDeploymentType
        PerUnitStorageThroughput: !Ref PerUnitStorageThroughput
        Compression: !Ref Compression
        LustreVersion: !Ref LustreVersion
        FSxLustreEnableEfa: !Ref FSxLustreEnableEfa
        DataRepositoryS3Path: !Ref DataRepositoryS3Path
        DirectoryDomainSuffix: !Ref DirectoryDomainSuffix
        HomeCapacity: !Ref HomeCapacity
        HomeThroughput: !Ref HomeThroughput
        OpenZFSDeploymentType: !Ref OpenZFSDeploymentType
        PostInstallScriptArgs: !Ref PostInstallScriptArgs
        AccountingPolicyEnforcement: !Ref AccountingPolicyEnforcement
        GpuHealthCheck: !Ref GpuHealthCheck
        GrafanaAccessCidr: !Ref GrafanaAccessCidr
        MonitoringVersion: !Ref MonitoringVersion
        MonitoringRepo: !Ref MonitoringRepo
        DcgmExporterImage: !Ref DcgmExporterImage
        DeployOnDemandCNG: !Ref DeployOnDemandCNG
        OnDemandCngName: !Ref OnDemandCngName
        OnDemandQueueName: !Ref OnDemandQueueName
        OnDemandInstanceType: !Ref OnDemandInstanceType
        OnDemandMaxCount: !Ref OnDemandMaxCount
        OnDemandMinCount: !Ref OnDemandMinCount
        OnDemandEfaInterfaceCount: !Ref OnDemandEfaInterfaceCount
        OnDemandPlacementGroupName: !Ref OnDemandPlacementGroupName
        DeployPseriesCNG: !Ref DeployPseriesCNG
        PseriesCngName: !Ref PseriesCngName
        PseriesQueueName: !Ref PseriesQueueName
        PseriesInstanceType: !Ref PseriesInstanceType
        PseriesMaxCount: !Ref PseriesMaxCount
        PseriesMinCount: !Ref PseriesMinCount
        CapacityReservationId: !Ref CapacityReservationId
        DeployG7Full: !Ref DeployG7Full
        G7FullName: !Ref G7FullName
        G7FullMaxCount: !Ref G7FullMaxCount
        G7FullMinCount: !Ref G7FullMinCount
        DeployG7Half: !Ref DeployG7Half
        G7HalfName: !Ref G7HalfName
        G7HalfMaxCount: !Ref G7HalfMaxCount
        G7HalfMinCount: !Ref G7HalfMinCount
        DeployG7eFull: !Ref DeployG7eFull
        G7eFullName: !Ref G7eFullName
        G7eFullMaxCount: !Ref G7eFullMaxCount
        G7eFullMinCount: !Ref G7eFullMinCount
        DeployG7eHalf: !Ref DeployG7eHalf
        G7eHalfName: !Ref G7eHalfName
        G7eHalfMaxCount: !Ref G7eHalfMaxCount
        G7eHalfMinCount: !Ref G7eHalfMinCount
        DeployG7eFullAz2: !Ref DeployG7eFullAz2
        G7eFullAz2Name: !Ref G7eFullAz2Name
        G7eFullAz2MaxCount: !Ref G7eFullAz2MaxCount
        G7eFullAz2MinCount: !Ref G7eFullAz2MinCount
        DeployG7eHalfAz2: !Ref DeployG7eHalfAz2
        G7eHalfAz2Name: !Ref G7eHalfAz2Name
        G7eHalfAz2MaxCount: !Ref G7eHalfAz2MaxCount
        G7eHalfAz2MinCount: !Ref G7eHalfAz2MinCount
        DeployG6eFullAz2: !Ref DeployG6eFullAz2
        G6eFullAz2Name: !Ref G6eFullAz2Name
        G6eFullAz2MaxCount: !Ref G6eFullAz2MaxCount
        G6eFullAz2MinCount: !Ref G6eFullAz2MinCount
        DeployG6eHalfAz2: !Ref DeployG6eHalfAz2
        G6eHalfAz2Name: !Ref G6eHalfAz2Name
        G6eHalfAz2MaxCount: !Ref G6eHalfAz2MaxCount
        G6eHalfAz2MinCount: !Ref G6eHalfAz2MinCount
        DeployG6eFullAz3: !Ref DeployG6eFullAz3
        G6eFullAz3Name: !Ref G6eFullAz3Name
        G6eFullAz3MaxCount: !Ref G6eFullAz3MaxCount
        G6eFullAz3MinCount: !Ref G6eFullAz3MinCount
        DeployG6eHalfAz3: !Ref DeployG6eHalfAz3
        G6eHalfAz3Name: !Ref G6eHalfAz3Name
        G6eHalfAz3MaxCount: !Ref G6eHalfAz3MaxCount
        G6eHalfAz3MinCount: !Ref G6eHalfAz3MinCount
        DeployG7eSmallTest: !Ref DeployG7eSmallTest
        G7eSmallTestName: !Ref G7eSmallTestName
        G7eSmallTestInstanceType: !Ref G7eSmallTestInstanceType
        G7eSmallTestMaxCount: !Ref G7eSmallTestMaxCount
        G7eSmallTestMinCount: !Ref G7eSmallTestMinCount
        DeployG6eSmallTest: !Ref DeployG6eSmallTest
        G6eSmallTestName: !Ref G6eSmallTestName
        G6eSmallTestInstanceType: !Ref G6eSmallTestInstanceType
        G6eSmallTestMaxCount: !Ref G6eSmallTestMaxCount
        G6eSmallTestMinCount: !Ref G6eSmallTestMinCount
        RootVolumeSize: !Ref RootVolumeSize
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Cluster'

Outputs:
  ClusterId:
    Description: PCS cluster ID
    Value: !GetAtt ClusterStack.Outputs.ClusterId
  Rocky9AmiId:
    Description: The Rocky 9 PCS AMI the cluster is running on (built in-stack, or the one you supplied).
    Value: !If
      - BuildAmi
      - !GetAtt Rocky9AmiStack.Outputs.Rocky9PCSAmiId
      - !Ref AmiId
