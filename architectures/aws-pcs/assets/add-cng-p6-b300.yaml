# SPDX-License-Identifier: MIT-0
#
# One add-cng template per GPU family by design: this file's NetworkInterfaces
# block is hand-built for the p6-b300 EFA layout, which is the odd one out --
# 17 network cards where card 0 is ENA-only (no EFA) and EFA runs on cards 1-16
# with DeviceIndex 0 (p5 and p6-b200 instead put EFA on card 0 with DeviceIndex 1).
# Folding all families into one parameterized template would be either unreadable
# (~32 per-card !If plus card-0/DeviceIndex branching) or require a
# CAPABILITY_AUTO_EXPAND transform that breaks the one-click quick-create links.
# See the rationale in add-cng-p5.yaml and the consolidation item in
# docs/ROADMAP.md. InstanceType is locked with AllowedValues to match this block.

AWSTemplateFormatVersion: '2010-09-09'
Description: Adding Compute Node Group to PCS Cluster with multi-network interface (EFA) support for P6-B300 (17 network cards; On-Demand or Capacity Block)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Capacity Blocks for ML Settings (Optional)
        Parameters:
          - CapacityReservationId
      - Label:
          default: Additional Compute Node Group Settings
        Parameters:
          - CngName
          - QueueName
          - InstanceType
          - MaxCount
          - MinCount
      - Label:
          default: PCS Cluster configuration
        Parameters:
          - ClusterId
          - SubnetId
          - AmiId
          - ClusterSecurityGroupId
          - IamProfileArn
          - FSxLustreFilesystemId
          - FSxLustreFilesystemMountName
          - FSxOpenZFSFilesystemId
      - Label:
          default: Monitoring configuration
        Parameters:
          - DeployMonitoring
          - MonitoringVersion
          - MonitoringRepo
          - MonitoringRole
      - Label:
          default: Post-install script (OnNodeConfigured)
        Parameters:
          - PostInstallScriptUrl
          - PostInstallScriptArgs

Parameters:
  CapacityReservationId:
    Type: String
    Description: >-
      (Optional) Capacity Block for ML reservation ID. When SET, the node group
      launches with MarketType=capacity-block against this reservation. Leave
      EMPTY for On-Demand. NOTE: this is for Capacity Blocks ONLY — do not put an
      On-Demand Capacity Reservation (ODCR) ID here. An ODCR with "open" matching
      is consumed automatically by On-Demand launches, so for ODCR leave this empty.
    Default: ""

  ClusterId:
    Type: String
    Description: Cluster ID (actual PCS cluster ID like pcs_xxxxx)

  ClusterName:
    Type: String
    Description: User-friendly cluster name

  CngName:
    Type: String
    Description: Name for Compute Node Group
    Default: "gpu-p6-b300"

  QueueName:
    Type: String
    Description: Name for Queue (leave empty to skip queue creation)
    Default: ""

  InstanceType:
    Type: String
    Description: >-
      Instance type for the compute node group. Locked to p6-b300.48xlarge: the
      NetworkInterfaces block below is hand-built for exactly this family's EFA
      layout (17 network cards; card 0 is ENA-only with EFA on cards 1-16, and the
      EFA cards use DeviceIndex 0 -- unlike p5/p6-b200). A different type would
      launch with the wrong NIC topology. Other GPU families have their own
      template (add-cng-p5.yaml, add-cng-p6-b200.yaml).
    Default: "p6-b300.48xlarge"
    AllowedValues:
      - p6-b300.48xlarge

  RootVolumeSize:
    Type: Number
    Description: >-
      Root EBS volume size (GiB) for compute nodes. The PCS-Ready DLAMI default (~75
      GiB) is too small for pulling/importing large container images (Enroot/Pyxis
      squashfs, Megatron ~20 GB). 300 GiB gives ample headroom.
    Default: 300
    MinValue: 75

  MaxCount:
    Type: Number
    Description: Maximum number of instance

  MinCount:
    Type: Number
    Description: Minimum number of instance. (it must be 0 if you want to use dynamic scaling)

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Select the Subnet where the Compute Node will be launched

  AmiId:
    Type: String
    Description: >-
      (Optional) AMI ID for the nodes. Leave empty to auto-resolve the latest
      PCS-Ready DLAMI (Ubuntu 24.04 x86_64) from SSM Parameter Store. Set an explicit
      ami-xxxx only to override (e.g. a custom AMI built with Enroot/Pyxis pre-baked).
    Default: ""
    AllowedPattern: '^$|^ami-[0-9a-f]{8,17}$'
    ConstraintDescription: Must be empty or a valid AMI ID (ami-xxxxxxxxxxxxxxxxx)

  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Select SecurityGroup for Compute Node Group for Cluster Communication

  IamProfileArn:
    Type: String
    Description: IAM Instance Profile for Compute Node Group

  FSxLustreFilesystemId:
    Type: String
    Description: Filesystem ID for FSx for Lustre

  FSxLustreFilesystemMountName:
    Type: String
    Description: MountName for FSx for Lustre

  FSxOpenZFSFilesystemId:
    Type: String
    Description: Filesystem ID for FSx for OpenZFS

  DeployMonitoring:
    Type: String
    Description: Deploy monitoring stack (Prometheus/Grafana on Login Node, DCGM exporter on Compute Node with GPU)
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  MonitoringVersion:
    Type: String
    Description: >-
      aws-parallelcluster-monitoring git ref to install (release tag, branch, or
      'latest'). Used both to fetch post-install.sh from MonitoringRepo at this
      ref and as the ref argument passed to it. Pin to a release tag for upstream
      stability in production; a branch name (e.g. a fork's dev branch) can be
      used together with MonitoringRepo for testing unreleased changes.
    Default: 'v2.9.1'

  MonitoringRepo:
    Type: String
    Description: >-
      GitHub "owner/repo" to fetch the monitoring stack from. Override with a fork
      together with a branch in MonitoringVersion to test unreleased changes before
      they merge upstream.
    Default: 'aws-samples/aws-parallelcluster-monitoring'

  DcgmExporterImage:
    Type: String
    Description: >-
      dcgm-exporter container image used by the monitoring stack on GPU nodes. The
      default is a DCGM 4.5.2 build pinned by DIGEST -- this covers Hopper / B200 /
      B300 alike (the digest pull bypasses the Docker 29.x OCI-index failure that
      breaks newer NVCR tags). To pin to the older monitoring-default 4.2.0 (covers
      Hopper + B200 only) or any other build, set this to that image reference
      (preferably also a digest). No effect on CPU nodes.
    Default: 'nvcr.io/nvidia/k8s/dcgm-exporter@sha256:a7ad6547d4546eaf4dd5d6b4c0b4db4101e63ef7dc3cdff7f42b767d2c60b706'

  MonitoringRole:
    Type: String
    Description: Monitoring role for this node (login=head node with Prometheus/Grafana, compute=compute node with exporters, none=no monitoring)
    Default: 'none'
    AllowedValues:
      - 'login'
      - 'compute'
      - 'none'

  PostInstallScriptUrl:
    Type: String
    Description: >-
      Optional URL of a post-install script to download and run on each node at
      first boot (PCS equivalent of ParallelCluster OnNodeConfigured). Leave
      empty or set to the literal 'none' to skip. To install Enroot/Pyxis, point this at assets/scripts/install-enroot-pyxis.sh.
      Accepts an s3:// URL (instance-role fetch; private bucket OK) or an http(s):// URL (curl; public only). For Enroot/Pyxis point at scripts/install-enroot-pyxis.sh in the templates bucket.
    Default: ''

  PostInstallScriptArgs:
    Type: String
    Description: Space-separated arguments passed to the post-install script.
    Default: ''

  GpuHealthCheck:
    Type: String
    Description: >-
      Install the GPU health-check suite on this node group for the Slurm health-check
      prolog. 'prolog' fetches the suite from
      s3://<bucket>/<prefix>gpu-healthcheck/gpu-healthcheck.tar.gz into
      /opt/aws/pcs/gpu-healthcheck at first boot, where the cluster-wide Prolog
      (set by cluster.yaml's matching GpuHealthCheck=prolog) invokes it. Set this on
      GPU compute node groups; the prolog itself is GPU-aware and no-ops on non-GPU
      nodes. 'none' (default) skips install.
    Default: 'none'
    AllowedValues:
      - 'none'
      - 'prolog'

  SlurmVersion:
    Type: String
    Description: >-
      The cluster's Slurm version, exported to the post-install script as
      PCS_SLURM_VERSION so it can put the matching Slurm CLI bin on slurmd's PATH
      (the Pyxis PMI hook needs scontrol). Must match the version the cluster was
      created with.
    Default: '25.11'
    AllowedValues:
      - '25.05'
      - '25.11'

  DirectoryDomainSuffix:
    Type: String
    Description: >-
      LDAP domain suffix (e.g. dc=cluster,dc=internal). Only used when
      DirectoryService != none.
    Default: 'dc=cluster,dc=internal'

  DirectoryRole:
    Type: String
    Description: >-
      This CNG's role in the directory service. 'server' = install and run
      the directory (slapd on login node). 'client' = configure SSSD to
      resolve users from the directory server. 'none' = skip directory setup.
      deploy-all sets this automatically (login=server, compute=client) when
      DirectoryService != none.
    Default: 'none'
    AllowedValues:
      - 'none'
      - 'server'
      - 'client'

  S3BucketName:
    Type: String
    Description: S3 bucket where scripts are stored (same as nested templates bucket)
    Default: 'awsome-distributed-ai'

  S3KeyPrefix:
    Type: String
    Description: S3 key prefix for scripts (e.g. templates/)
    Default: 'templates/'

  ComputeInitScriptsDir:
    Type: String
    Description: >-
      (Optional) Directory scanned at first boot; every regular file in it is run
      once per node, in sorted (LC_ALL=C) order, as root, with log-and-continue on
      failure (a failing script is logged but the node still joins). Default
      '/fsx/s3/compute-init' is a folder under the S3<->Lustre DRA mount, so scripts
      uploaded to the linked S3 bucket auto-appear on every compute node. Set to
      'none' to disable (deploy-all passes 'none' for the login node). No-op when the
      folder is absent (e.g. the S3 DRA is not enabled or nothing was uploaded yet).
    Default: '/fsx/s3/compute-init'

Conditions:
  UseCapacityBlock: !Not [!Equals [!Ref CapacityReservationId, ""]]
  UseOnDemand: !Equals [!Ref CapacityReservationId, ""]
  CreateQueue: !Not [!Equals [!Ref QueueName, ""]]
  # Emit the monitoring-role tag for both login and compute nodes (any role
  # other than 'none'). The monitoring stack identifies login nodes by this
  # tag (monitoring-role=login) and excludes them from EC2 service discovery.
  IsMonitoringRoleSet: !Not [!Equals [!Ref MonitoringRole, 'none']]
  HasAmiId: !Not [!Equals [!Ref AmiId, ""]]
  DirectoryEnabled: !Not [!Equals [!Ref DirectoryRole, 'none']]

Resources:

  # Cluster Placement Group (On-Demand only)
  PlacementGroup:
    Type: AWS::EC2::PlacementGroup
    Condition: UseOnDemand
    Properties:
      Strategy: cluster

  # Compute Node groups - Compute Nodes
  PCSNodeGroupCompute:
    Type: AWS::PCS::ComputeNodeGroup
    Properties:
      ClusterId: !Ref ClusterId
      Name: !Ref CngName
      ScalingConfiguration:
        MinInstanceCount: !Ref MinCount
        MaxInstanceCount: !Ref MaxCount
      IamInstanceProfileArn: !Ref IamProfileArn
      CustomLaunchTemplate:
        TemplateId: !Ref PCSLaunchTemplate
        # Track the latest launch template version so template updates (e.g. NIC
        # or UserData changes) actually reach the node group. Hardcoding Version: 1
        # pins the node group to the original version and silently ignores updates.
        Version: !GetAtt PCSLaunchTemplate.LatestVersionNumber
      SubnetIds:
        - !Ref SubnetId
      AmiId: !If
        - HasAmiId
        - !Ref AmiId
        - '{{resolve:ssm:/aws/service/pcs/ami/dlami-base-ubuntu2404/x86_64/latest/ami-id}}'
      InstanceConfigs:
        - InstanceType: !Ref InstanceType
      PurchaseOption: !If [UseCapacityBlock, CAPACITY_BLOCK, !Ref "AWS::NoValue"]

  PCSQueueCompute:
    Type: AWS::PCS::Queue
    Condition: CreateQueue
    Properties:
      ClusterId: !Ref ClusterId
      Name: !Ref QueueName
      ComputeNodeGroupConfigurations:
        - ComputeNodeGroupId: !GetAtt [PCSNodeGroupCompute, Id]

  PCSLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'PCS-lt-${AWS::StackName}'

      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: !Ref RootVolumeSize
              VolumeType: gp3
              DeleteOnTermination: true
        InstanceMarketOptions: !If
          - UseCapacityBlock
          - MarketType: capacity-block
          - !Ref AWS::NoValue
        CapacityReservationSpecification: !If
          - UseCapacityBlock
          - CapacityReservationTarget:
              CapacityReservationId: !Ref CapacityReservationId
          - !Ref AWS::NoValue
        Placement: !If
          - UseOnDemand
          - GroupName: !Ref PlacementGroup
          - !Ref AWS::NoValue
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: HPCRecipes
                Value: "true"
              # Name is free for arbitrary operator use. The monitoring stack
              # identifies login vs compute nodes via the monitoring-role tag
              # (below), not Name, so dashboards work regardless of this value.
              # Default to PCS-<cngname> (mirrors CngName) for a recognizable
              # console name; retag freely afterward.
              - Key: Name
                Value: !Sub 'PCS-${CngName}'
              - Key: CngName
                Value: !Sub 'PCS-${CngName}'
              - Key: ClusterName
                Value: !Ref ClusterName
              - Key: pcs-cluster-id
                Value: !Ref ClusterId
              # Node type for the monitoring stack. Emitted for both login and
              # compute (any role != none). Prometheus drops monitoring-role=login
              # from EC2 SD (the static login_node job scrapes it); everything else
              # is reported as instance_name=Compute. See aws-parallelcluster-monitoring
              # prometheus-pcs.yml and issue #45.
              - !If
                - IsMonitoringRoleSet
                - Key: monitoring-role
                  Value: !Ref MonitoringRole
                - !Ref AWS::NoValue
              # Directory (multi-user) role tag, independent of monitoring-role.
              # Emitted for both server (login) and client (compute) nodes when
              # DirectoryRole != none. Compute clients discover the OpenLDAP
              # server by querying for directory-role=server (NOT monitoring-role,
              # which is owned by the monitoring stack). See setup-directory.sh.
              - !If
                - DirectoryEnabled
                - Key: directory-role
                  Value: !Ref DirectoryRole
                - !Ref AWS::NoValue
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 4
          HttpTokens: required
          InstanceMetadataTags: enabled
        UserData:
          Fn::Base64: !Sub |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==MYBOUNDARY=="

            --==MYBOUNDARY==
            Content-Type: text/cloud-config; charset="us-ascii"
            MIME-Version: 1.0

            runcmd:
            # SSM agent (Rocky/RHEL only). Stock Rocky lacks it; the Rocky PCS AMI installs it
            # at build, but EC2 Image Builder's finalization REMOVES the agent from the output
            # AMI (Image Builder uses SSM to orchestrate the build and uninstalls it on cleanup),
            # so it is absent at first boot. Install-if-missing (region rpm via IMDS), then
            # enable + start. No-op on Ubuntu (DLAMI ships SSM running) and on non-dnf systems.
            - |
              if command -v dnf >/dev/null 2>&1; then
                if ! rpm -q amazon-ssm-agent >/dev/null 2>&1; then
                  TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
                  R=$(curl -s -H "X-aws-ec2-metadata-token: ${!TOKEN}" http://169.254.169.254/latest/meta-data/placement/region)
                  dnf install -y "https://s3.${!R}.amazonaws.com/amazon-ssm-${!R}/latest/linux_amd64/amazon-ssm-agent.rpm" || true
                fi
                systemctl enable --now amazon-ssm-agent || true
              fi
            # AWS CLI (Rocky/RHEL only). Stock Rocky lacks the `aws` CLI (the Ubuntu DLAMI
            # ships it), and the Rocky PCS AMI only bakes it in from the v1.3.0 build onward
            # -- so on an older AMI the post-install (s3 cp), GPU-healthcheck (s3 cp), and
            # monitoring (ssm put-parameter) runcmds below fail "aws: command not found"
            # (exit 127). Install-if-missing from appstream before anything uses `aws`.
            # No-op on Ubuntu (aws already on PATH) and on non-dnf systems.
            - |
              if command -v dnf >/dev/null 2>&1 && ! command -v aws >/dev/null 2>&1; then
                dnf install -y awscli2 || dnf install -y awscli || true
              fi
            # slurmd controller self-heal (Rocky/RHEL only; pre-v1.3.0 AMIs). The Rocky PCS
            # AMI baked /etc/sysconfig/slurmd with only a PATH= line. The PCS agent's early
            # bootcmd writes that file with SLURMD_OPTIONS='--conf-server=<ctl:port> ...'
            # ONLY if it does not already exist -- so on those AMIs it is SKIPPED, slurmd
            # starts with no --conf-server, falls back to a DNS-SRV lookup that fails
            # ("resolve_ctls_from_dns_srv: Unknown host"), never starts, and PCS
            # health-REPLACES the node. This runcmd runs AFTER the PCS bootcmd but BEFORE
            # pcs_bootstrap_finalize.sh starts slurmd, so healing here fixes the very first
            # slurmd start: move the baked PATH into a systemd drop-in, delete the file, and
            # re-run the PCS per-instance config so it writes the real --conf-server options.
            # No-op once the AMI stops baking the file (v1.3.0+) and on Ubuntu.
            - |
              if command -v dnf >/dev/null 2>&1 && [ -f /etc/sysconfig/slurmd ] \
                 && ! grep -q SLURMD_OPTIONS /etc/sysconfig/slurmd \
                 && [ -x /opt/aws/pcs/bin/pcs_bootstrap_config_per_instance.sh ]; then
                SLURMD_PATH=$(sed -n 's/^PATH=//p' /etc/sysconfig/slurmd | head -1)
                if [ -n "${!SLURMD_PATH}" ]; then
                  mkdir -p /etc/systemd/system/slurmd.service.d
                  printf '[Service]\nEnvironment=PATH=%s\n' "${!SLURMD_PATH}" \
                    > /etc/systemd/system/slurmd.service.d/10-slurm-path.conf
                fi
                rm -f /etc/sysconfig/slurmd
                /opt/aws/pcs/bin/pcs_bootstrap_config_per_instance.sh /etc/amazon/pcs/bootstrap_config.json || true
                systemctl daemon-reload || true
              fi
            # Post-install script (optional) - generic OnNodeConfigured-style hook.
            # Downloads and runs a user-supplied script (e.g. Enroot/Pyxis install).
            - |
              # Skip when empty OR the literal sentinel "none" (case-insensitive).
              # NOTE: CloudFormation trims a whitespace-only parameter value to empty,
              # so a "single space to skip" never reaches here as a space — it arrives
              # empty and takes the default-installer branch upstream. Use "none" for a
              # reliable skip that survives CFN trimming.
              PIS_URL="${PostInstallScriptUrl}"
              PIS_LC=$(printf '%s' "${!PIS_URL}" | tr '[:upper:]' '[:lower:]')
              if [ -n "${!PIS_URL}" ] && [ "${!PIS_LC}" != "none" ]; then
                echo "Downloading post-install script from ${!PIS_URL}..." | tee /var/log/pcs-post-install.log
                case "${!PIS_URL}" in
                  s3://*) aws s3 cp "${!PIS_URL}" /tmp/pcs-post-install.sh >> /var/log/pcs-post-install.log 2>&1 ;;
                  *)      curl -fsSL "${!PIS_URL}" -o /tmp/pcs-post-install.sh ;;
                esac
                chmod +x /tmp/pcs-post-install.sh
                echo "Executing post-install script..." | tee -a /var/log/pcs-post-install.log
                # Tell the script this cluster's Slurm version (it can't discover it at
                # first boot, before slurmd/profile.d/controller exist). See script header.
                export PCS_SLURM_VERSION="${SlurmVersion}"
                bash /tmp/pcs-post-install.sh ${PostInstallScriptArgs} >> /var/log/pcs-post-install.log 2>&1
                echo "Post-install script completed (exit $?)" | tee -a /var/log/pcs-post-install.log
              else
                echo "No post-install script configured (PostInstallScriptUrl empty or 'none')" | tee /var/log/pcs-post-install.log
              fi
            # GPU health-check suite (optional). When GpuHealthCheck != none, fetch the
            # suite tarball from the templates bucket and extract to a FIXED path that the
            # cluster-wide Slurm Prolog (set in cluster.yaml) references.
            - |
              if [ "${GpuHealthCheck}" != "none" ]; then
                echo "Installing GPU health-check suite..." | tee /var/log/pcs-gpu-healthcheck-install.log
                mkdir -p /opt/aws/pcs/gpu-healthcheck
                if aws s3 cp "s3://${S3BucketName}/${S3KeyPrefix}gpu-healthcheck/gpu-healthcheck.tar.gz" /tmp/gpu-healthcheck.tar.gz >> /var/log/pcs-gpu-healthcheck-install.log 2>&1; then
                  tar -xzf /tmp/gpu-healthcheck.tar.gz -C /opt/aws/pcs/gpu-healthcheck --strip-components=1 >> /var/log/pcs-gpu-healthcheck-install.log 2>&1
                  chmod +x /opt/aws/pcs/gpu-healthcheck/gpu-healthcheck.sh \
                           /opt/aws/pcs/gpu-healthcheck/checks/*.sh \
                           /opt/aws/pcs/gpu-healthcheck/slurm/*.sh 2>> /var/log/pcs-gpu-healthcheck-install.log
                  echo "GPU health-check suite installed to /opt/aws/pcs/gpu-healthcheck (exit $?)" | tee -a /var/log/pcs-gpu-healthcheck-install.log
                else
                  echo "WARNING: failed to fetch gpu-healthcheck.tar.gz; prolog will be missing on this node" | tee -a /var/log/pcs-gpu-healthcheck-install.log
                fi
              fi
            # FSx Home directories mount. Works on both Ubuntu (SELinux absent) and
            # Rocky/RHEL (SELinux enforcing): the SELinux step is guarded on sestatus,
            # so it is a no-op where SELinux is not present and load-bearing where it is.
            - mkdir -p /tmp/home
            - rsync -aA /home/ /tmp/home
            - echo "${FSxOpenZFSFilesystemId}.fsx.${AWS::Region}.amazonaws.com:/fsx/ /home nfs noatime,nfsvers=3,sync,nconnect=16,rsize=1048576,wsize=1048576,defaults 0 0" >> /etc/fstab
            - mount -a -t nfs defaults
            # SELinux (Rocky/RHEL): allow home over NFS. On Ubuntu sestatus is absent so
            # this whole line is a no-op. The Rocky PCS AMI is built permissive by default
            # (denials logged, not enforced); these booleans make the enforcing path work too.
            - if command -v sestatus >/dev/null 2>&1 && [ "enabled" = "$(sestatus | awk '/^SELinux status:/{print $3}')" ]; then setsebool -P use_nfs_home_dirs 1 || true; fi
            - rsync -aA --ignore-existing /tmp/home/ /home
            - rm -rf /tmp/home/
            # If provided, mount FSxL filesystem as /fsx
            - if [ ! -z "${FSxLustreFilesystemId}" ]; then mkdir -p /fsx; mount -t lustre -o noatime,flock,lazystatfs ${FSxLustreFilesystemId}.fsx.${AWS::Region}.amazonaws.com@tcp:/${FSxLustreFilesystemMountName} /fsx; chmod 1777 /fsx; fi
            # compute-init (optional): S3 runner runs scripts in ComputeInitScriptsDir at boot; 'none' disables. See scripts/run-compute-init.sh.
            - |
              if [ "${ComputeInitScriptsDir}" != none ]; then
                export PCS_SLURM_VERSION="${SlurmVersion}"
                aws s3 cp "s3://${S3BucketName}/${S3KeyPrefix}scripts/run-compute-init.sh" /tmp/rci.sh >/var/log/pcs-compute-init.log 2>&1 && bash /tmp/rci.sh "${ComputeInitScriptsDir}" || true
              fi
            # Monitoring stack installation (optional, enabled on Login Node only)
            - |
              if [ "${DeployMonitoring}" = "true" ]; then
                echo "Installing monitoring stack..."
                # Fetch post-install.sh from MonitoringRepo at the MonitoringVersion ref, and
                # pass both the ref and the repo to it so the tarball is pulled from the same
                # source. This lets a fork + branch be used for testing unreleased changes.
                # As of v2.6.3 the installer auto-detects the Ubuntu 'ubuntu' user and runs
                # install.sh itself (PR #44), so no ec2-user shim or local-var patch is needed.
                # Optional dcgm-exporter image override (e.g. a B300-capable DCGM
                # >= 4.4.0 build by digest). The monitoring installer reads
                # DCGM_EXPORTER_IMAGE from its environment and falls back to its
                # default pin when empty, so leaving DcgmExporterImage empty keeps
                # the stock behaviour. See aws-parallelcluster-monitoring #50.
                export DCGM_EXPORTER_IMAGE="${DcgmExporterImage}"
                curl -fsSL https://raw.githubusercontent.com/${MonitoringRepo}/${MonitoringVersion}/post-install.sh -o /tmp/post-install.sh
                # Retry up to 3 times: the install can hit transient first-boot
                # failures (apt lock contention with cloud-init, network, or the
                # shared NFS /home still settling). The installer is idempotent
                # (reuses the existing Grafana SSM param, recreates containers),
                # so re-running is safe and self-heals a one-off hiccup instead
                # of leaving the node unmonitored.
                rc=1
                for attempt in 1 2 3; do
                  echo "Monitoring install attempt $attempt/3..." >> /var/log/monitoring-install.log
                  bash /tmp/post-install.sh ${MonitoringVersion} ${MonitoringRepo} >> /var/log/monitoring-install.log 2>&1
                  rc=$?
                  [ $rc -eq 0 ] && break
                  echo "Monitoring install attempt $attempt failed (exit $rc); retrying in 15s..." >> /var/log/monitoring-install.log
                  sleep 15
                done
                echo "Monitoring installation complete (exit $rc)" >> /var/log/monitoring-install.log
              fi
            - |
              # Multi-user directory setup (optional, DirectoryRole != none)
              if [ "${DirectoryRole}" != "none" ]; then
                export LDAP_DOMAIN_SUFFIX="${DirectoryDomainSuffix}"
                export LDAP_DOMAIN=$(echo "${DirectoryDomainSuffix}" | sed 's/dc=//g; s/,/./g')
                export LDAP_ADMIN_PASSWORD=$(openssl rand -base64 16)
                export CLUSTER_ID="${ClusterId}"
                export DIRECTORY_DNS_IPS=""
                # Pass the script source so the server role can install the
                # ldap-add-user.sh helper onto /usr/local/bin from the same bucket.
                export S3_BUCKET="${S3BucketName}"
                export S3_KEY_PREFIX="${S3KeyPrefix}"
                aws s3 cp s3://${S3BucketName}/${S3KeyPrefix}scripts/setup-directory.sh /tmp/setup-directory.sh
                chmod +x /tmp/setup-directory.sh
                bash /tmp/setup-directory.sh "${DirectoryRole}" 2>&1 | tee /var/log/directory-setup.log
              fi

            --==MYBOUNDARY==
        NetworkInterfaces:
          # Primary network interface: ENA on network card 0, device index 0.
          # On P6, network card 0 does not support EFA (EFA limit 0), so this
          # must be a plain ENA interface (no InterfaceType).
          - Description: Primary network interface (ENA)
            DeviceIndex: 0
            NetworkCardIndex: 0
            SubnetId: !Ref SubnetId
            Groups:
            - !Ref ClusterSecurityGroupId
          # EFA on network cards 1-16 (device index 0). PCS requires
          # InterfaceType: efa (not efa-only) to propagate the interface
          # configuration to the launch instances request correctly.
